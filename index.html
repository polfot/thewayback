<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Way Back</title>
    <link rel="icon" type="image/png" href="resources/favicon.png">
    <link rel="apple-touch-icon" href="resources/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Short+Stack&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/game.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HDDNL0SX8B"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-HDDNL0SX8B');
    </script>
</head>
<body>
    <div id="start-screen">
        <canvas id="title-anim" width="500" height="60"></canvas>
        <h1>THE WAY BACK</h1>
        <label for="player-name">YOUR NAME</label>
        <input type="text" id="player-name" maxlength="10" placeholder="Nick" autofocus>
        <label for="dog-name">DOG'S NAME</label>
        <input type="text" id="dog-name" maxlength="10" placeholder="Rex">
        <div class="error-msg" id="name-error"></div>
        <div id="difficulty-select">
            <button class="diff-btn" data-diff="0">HIKERS</button>
            <button class="diff-btn selected" data-diff="1">MOUNTAINEERS</button>
            <button class="diff-btn" data-diff="2">THE MISTS</button>
        </div>
        <div id="diff-desc">Balanced survival experience</div>
        <button id="start-btn">START</button>
        <button id="tutorial-btn">TUTORIAL</button>
    </div>

    <div id="tutorial-overlay" style="display:none;">
        <div id="tutorial-box">
            <div id="tutorial-title"></div>
            <div id="tutorial-body"></div>
            <div id="tutorial-nav">
                <button id="tut-prev" class="tut-nav-btn">PREV</button>
                <span id="tut-page"></span>
                <button id="tut-next" class="tut-nav-btn">NEXT</button>
            </div>
            <button id="tut-close">CLOSE</button>
        </div>
    </div>

    <div id="game-wrapper" style="display:none;">
        <canvas id="game-canvas" width="800" height="520"></canvas>
    </div>

    <script src="js/data.js?v=229"></script>
    <script src="js/audio.js?v=229"></script>
    <script src="js/loader.js?v=229"></script>
    <script src="js/sprites.js?v=229"></script>
    <script src="js/game.js?v=229"></script>
    <script src="js/main.js?v=229"></script>
</body>
</html>
